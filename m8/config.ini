[graphics]
; The M8 screen is 320x240 and the PiBoy DSI panel is 640x480 — exactly 2x, so
; integer scaling gives a pixel-perfect image with no letterboxing.
fullscreen=true
wait_packets=256
integer_scaling=true
[audio]
; The Teensy exposes a USB audio device; m8c captures it and plays it back
; through SDL -> pipewire -> bcm2835 Headphones -> PiBoy amp/speaker. This is
; the only way to get M8 audio out of the PiBoy: the board has no line input.
; audio_buffer_size is THE latency knob (frames): lower = tighter, more risk of
; artifacts. audio_device_name may need the real capture device name instead of
; "Default" if pipewire has no default source.
audio_enabled=true
audio_buffer_size=1024
audio_device_name=Default
[keyboard]
;Ref: https://wiki.libsdl.org/SDL2/SDL_Scancode
key_up=82
key_left=80
key_down=81
key_right=79
key_select=225
key_select_alt=29
key_start=44
key_start_alt=27
key_opt=226
key_opt_alt=4
key_edit=224
key_edit_alt=22
key_delete=76
key_reset=21
key_jazz_inc_octave=85
key_jazz_dec_octave=84
key_jazz_inc_velocity=87
key_jazz_dec_velocity=86
key_toggle_audio=69
key_toggle_settings=58
key_toggle_log=59
[gamepad]
; Values are SDL_GamepadButton enum indices, resolved through the mapping that
; m8c.sh exports in SDL_GAMECONTROLLERCONFIG.
;   11-14 = D-pad, 4 = BACK (SELECT), 6 = START, 1 = EAST (B), 0 = SOUTH (A)
gamepad_up=11
gamepad_left=13
gamepad_down=12
gamepad_right=14
gamepad_select=4
gamepad_start=6
gamepad_opt=1
gamepad_edit=0
; quit = 8 (RIGHT_STICK) -> mapped to the PiBoy's Z button.
gamepad_quit=8
; reset = 9 (LEFT_SHOULDER) -> the L button. Default was 7 (LEFT_STICK), which
; on this pad is the stick click (b15) — far too easy to hit by accident.
gamepad_reset=9
; Seuil analogique, en unités SDL (0..32767). Mesuré le 2026-07-27 : SDL3 mappe
; l'axe brut 0..255 linéairement, sdl = (raw-127,5) x 257 — et il IGNORE le
; champ evdev `flat`, donc il n'y a pas de zone morte à ce niveau-là. 30000
; correspondait à raw >= 244, atteint bien avant la butée parce que le
; potentiomètre sature à 0/255 : 53% du temps hors centre était déjà au rail.
; 32500 = raw >= 254, il faut donc pousser franchement jusqu'en butée.
gamepad_analog_threshold=32500
gamepad_analog_invert=false
gamepad_analog_axis_updown=1
gamepad_analog_axis_leftright=0
gamepad_analog_axis_select=4
gamepad_analog_axis_start=5
gamepad_analog_axis_opt=-1
gamepad_analog_axis_edit=-1
