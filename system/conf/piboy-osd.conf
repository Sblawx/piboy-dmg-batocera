# PiBoy DMG - on-screen display (piboy-osd)
# Most changes apply within ~1 s. height / sizes / position need an OSD restart:
#   batocera-services restart piboyosd

[osd]
# Master switch: 1 = shown, 0 = everything hidden
enabled = 1

# Per-element display mode:
#   off  = never
#   es   = only in EmulationStation (menus)
#   game = only in game
#   both = everywhere
battery_mode   = both
temp_mode      = es
cpu_mode       = es
volume_mode    = both
wifi_mode      = es
bluetooth_mode = es
clock_mode     = off

# Bar position: top | bottom
position = top

# How long the volume bar stays after a volume-wheel change (seconds)
volume_seconds = 2

# Geometry (needs an OSD restart)
height    = 46
text_size = 20
icon_size = 15

# Language of the System Settings menu: en | fr
language = en

resources = /userdata/system/piboy-osd/resources
