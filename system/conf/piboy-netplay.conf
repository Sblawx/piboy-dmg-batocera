# LAN netplay - used ONLY by the "Netplay - Host" Ports entry (fallback).
# The normal way to host is EmulationStation's own menu: long press A on a game
# -> netplay -> host. The other console then just runs "Netplay - Join".
#
# Both consoles need the exact same ROM file at the same path AND the same core,
# otherwise RetroArch refuses the connection ("different core").

system = snes
rom    = /userdata/roms/snes/My Game (Europe).zip
core   = snes9x_next
port   = 55435
